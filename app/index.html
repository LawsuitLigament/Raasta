<!DOCTYPE html>
<html lang="en" data-theme="mocha">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Raasta — Find the fastest route or least interchanges between any two Delhi Metro stations. Fare calculator, station info, and offline support." />
  <meta name="theme-color" content="#1e1e2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Raasta</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚇</text></svg>" />
</head>

<body>
  <div id="app">
    <div id="loading-screen" class="loading-screen">
      <div class="loader">
        <div class="metro-train">
          <div class="train-body"></div>
          <div class="train-windows"></div>
        </div>
        <div class="track"></div>
      </div>
      <p class="loading-text">Loading Metro Data...</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
